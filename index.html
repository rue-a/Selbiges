<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Selbiges</title>
	<meta name="theme-color" content="#4c1d95">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap">
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<main class="layout">
		<section class="zone zone-top">
			<p class="line" id="line1">&nbsp;</p>
		</section>
		<section class="zone zone-bottom">
			<p class="line" id="line2">&nbsp;</p>
		</section>
		<button id="next-btn" type="button">Weiter</button>
		<div class="end-panel" id="end-panel" hidden>
			<p class="hint">Alle Kategorien wurden gezeigt!<br>Starte ein neues Spiel.</p>
			<button id="new-game-btn" type="button">Neues Spiel</button>
		</div>
	</main>
	<script src="app.js"></script>
</body>

</html>
